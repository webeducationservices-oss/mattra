<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>What&rsquo;s Going On? &mdash; Home Diagnostic | Mattra Inc.</title>
  <meta name="description" content="Not sure what's happening with your home? Mattra's free diagnostic helps identify mold, insulation, moisture, and structural issues — and connects you with the right team." />
  <link rel="canonical" href="https://www.mattrainc.com/diagnostic" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/globals.css" />
  <style>
    .diag-page { min-height: 100vh; background: var(--light-gray); }
    .diag-hero {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-primary) 100%);
      padding: 48px 0 56px;
      text-align: center;
    }
    .diag-hero h1 {
      color: var(--white);
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      margin-bottom: 12px;
    }
    .diag-hero p {
      color: rgba(255,255,255,0.85);
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto;
    }
    .diag-standalone {
      max-width: 720px;
      margin: -32px auto 64px;
      padding: 0 24px;
      position: relative;
      z-index: 2;
    }
    /* Bigger card on standalone page */
    .diag-standalone .diag-card { padding: 40px 40px 32px; }
    .diag-standalone .diag-title { font-size: 1.4rem; }
    @media (max-width: 640px) {
      .diag-standalone { margin: -24px 16px 48px; padding: 0; }
      .diag-standalone .diag-card { padding: 28px 20px 24px; }
    }
  </style>
  <!-- myaieditor inline-edit loader (no-op for real visitors) -->
  <script src="/mae-edit-loader.js" async></script>
</head>
<body>

<div id="topbar"></div>
<div id="header"></div>

<div class="diag-page">
  <div class="diag-hero">
    <div class="container">
      <h1>What&rsquo;s Going On With Your Home?</h1>
      <p>No pressure, no jargon. Just a few quick questions so we can point you in the right direction.</p>
    </div>
  </div>

  <div class="diag-standalone">
    <div class="diagnostic-form"></div>
  </div>
</div>

<div id="footer"></div>

<script src="/components.js"></script>
<script src="/diagnostic-form.js"></script>
</body>
</html>
